<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Hub</title>
    <style>
        :root {
            --bg-color: #1e122b;
            --text-color: #e1b3ff;
            --accent: #b366ff;
        }
        body.lofi-purple { --bg-color: #1e122b; --text-color: #e1b3ff; --accent: #b366ff; }
        body.rainy-cafe { --bg-color: #2c221e; --text-color: #f3d1be; --accent: #df9a6c; }
        body.synthwave { --bg-color: #0b1d3a; --text-color: #00ffcc; --accent: #ff007f; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh;
            transition: all 0.4s ease;
        }
        .gateway-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--accent);
            padding: 30px; border-radius: 16px;
            text-align: center; max-width: 450px; width: 90%;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .hidden { display: none !important; }
        input {
            background: rgba(255,255,255,0.1); border: 1px solid var(--accent);
            color: #fff; padding: 10px 15px; border-radius: 8px;
            margin: 8px 0; width: 85%; font-size: 1rem;
        }
        button {
            background: transparent; border: 2px solid var(--accent);
            color: var(--text-color); padding: 10px 20px;
            border-radius: 25px; cursor: pointer; font-weight: bold;
            margin-top: 15px; transition: all 0.2s ease;
        }
        button:hover { background: var(--accent); color: #000; transform: scale(1.03); }
        .token-card {
            font-family: monospace; font-size: 1.3rem; color: #00ffcc;
            background: #000; padding: 10px; border-radius: 6px;
            margin: 15px 0; border: 1px dashed #00ffcc; display: block;
        }
    </style>
</head>
<body class="lofi-purple" id="globalBody">

    <div class="gateway-panel" id="gatewayBox">
        <h2>Elite Study Vault Gateway 🎒</h2>
        <p id="statusPrompt">Initialize your student profile to decrypt the library database.</p>
        
        <!-- TOKEN SHOWCASE FOR NEW USERS -->
        <div id="tokenGate">
            <p style="font-size: 0.9rem; opacity: 0.8;">Your assigned secure login token:</p>
            <span class="token-card" id="userToken">PORTAL-X9921</span>
            <button onclick="advanceToCredentials()">I've Copied the Token</button>
        </div>

        <!-- PROFILE SIGNUP STEP -->
        <div id="profileGate" class="hidden">
            <input type="text" id="usernameInput" placeholder="Create Username"><br>
            <input type="password" id="passwordInput" placeholder="Create Password"><br>
            
            <p style="margin-top:15px; font-size:0.9rem;">Choose Initial Workspace Theme:</p>
            <button onclick="setVibe('lofi-purple')">🔮 Lofi</button>
            <button onclick="setVibe('rainy-cafe')">☕ Cafe</button>
            <button onclick="setVibe('synthwave')">⚡ Neon</button>
            <br>
            <button onclick="unlockAndRedirect()" style="width: 90%; background: var(--accent); color: #000;">🔓 Unlock Library</button>
        </div>
    </div>

    <script>
        const tokens = ["MATH-GENIE-7721", "PMT-VAULT-4481", "KHAN-ELITE-1102", "UPLEARN-PRO-9952"];
        
        window.onload = function() {
            const activeProfile = localStorage.getItem('active_student');
            if (activeProfile) {
                // If already logged in previously, immediately pass them straight to your site!
                window.location.href = "https://google.com";
            } else {
                const randomToken = tokens[Math.floor(Math.random() * tokens.length)];
                document.getElementById('userToken').innerText = randomToken;
            }
        };

        function advanceToCredentials() {
            document.getElementById('tokenGate').classList.add('hidden');
            document.getElementById('profileGate').classList.remove('hidden');
            document.getElementById('statusPrompt').innerText = "Create permanent account records below.";
        }

        function setVibe(className) {
            document.getElementById('globalBody').className = className;
            localStorage.setItem('student_vibe', className);
        }

        function unlockAndRedirect() {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();

            if (!user || !pass) {
                alert("Please fill out both data fields to establish your profile.");
                return;
            }

            // Save login credentials safely inside browser memory cache
            localStorage.setItem('active_student', user);
            
            // Instantly send them directly to your public Google Site folder out of the frame cage!
            window.location.href = "https://google.com";
        }
    </script>
</body>
</html>
